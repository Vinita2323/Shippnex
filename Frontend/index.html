<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/Logo.png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ShippNex</title>
    <!-- Paint a white shell immediately so mobile WebViews do not flash black
         before the JS/CSS bundle finishes loading. -->
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        background-color: #ffffff;
      }
      #root {
        min-height: 100dvh;
        min-height: 100vh;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCqig06mCC6EI6mL0zY4gltI49j13cJSXA&libraries=places,geometry&loading=async" async defer></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;min-height:100vh;background:#ffffff;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
